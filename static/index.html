        { key: "lbl", title: "Vistas ilustrativas sin etiquetar", evidence: "Vistas de diagramas no etiquetadas como 'no aptas para construcción'.", explanation: "Los planos estructurales esquemáticos deben distinguirse claramente de los detalles de construcción.", correction: "Etiquetar vistas como esquemáticas frente a vistas para construcción." },
        { key: "R311.7", title: "Ancho de escalera por debajo del mínimo", evidence: "Nota de escalera 'ancho mín 34in'.", explanation: "El ancho mínimo de la escalera según el Código Residencial Internacional es de 36 pulgadas.", correction: "Corregir nota a un ancho libre mínimo de 36\"." },
        { key: "QA_win", title: "Falta columna de apertura libre neta", evidence: "El programa carece de columna de apertura libre neta.", explanation: "Se requiere una columna de apertura libre neta en los programas de ventanas para verificar el cumplimiento de los EEROs.", correction: "Añadir una columna de apertura libre neta al programa de ventanas." },
        { key: "win", title: "Falta columna de apertura libre neta", evidence: "El programa carece de columna de apertura libre neta.", explanation: "Se requiere una columna de apertura libre neta en los programas de ventanas para verificar el cumplimiento de los EEROs.", correction: "Añadir una columna de apertura libre neta al programa de ventanas." },
        { key: "AppG", title: "Determinación de zona de inundación ausente", evidence: "Parcela costera; no se muestra zona FEMA ni BFE.", explanation: "Las parcelas costeras requieren consideraciones de diseño de inundaciones para resistir olas y fuerzas hidrodinámicas.", correction: "Añadir determinación de inundación; si es SFHA mostrar BFE + ASCE 24." },
        { key: "flood", title: "Determinación de zona de inundación ausente", evidence: "Parcela costera; no se muestra zona FEMA ni BFE.", explanation: "Las parcelas costeras requieren consideraciones de diseño de inundaciones para resistir olas y fuerzas hidrodinámicas.", correction: "Añadir determinación de inundación; si es SFHA mostrar BFE + ASCE 24." },
        { key: "QA", title: "Discrepancia en el índice de planos", evidence: "El índice incluye planos que no están presentan en el paquete.", explanation: "El índice de planos debe coincidir exactamente con los planos presentados para evitar vacíos en la documentación.", correction: "Conciliar el índice con los planos presentados." }
      ];

      const code = String(f.code || "").toLowerCase();
      const title = String(f.title || "").toLowerCase();
      const id = String(f.id || "").toLowerCase();

      // Find first match based on code or title or ID keyword
      let tr = null;
      for (const m of codeMatches) {
        const key = m.key.toLowerCase();
        if (code.includes(key) || title.includes(key) || id.includes(key)) {
          tr = m;
          break;
        }
      }

      // Fallback matching by common English phrases if code/title contains keywords
      if (!tr) {
        if (title.includes("seal") || title.includes("signature")) {
          tr = codeMatches.find(x => x.key === "107");
        } else if (title.includes("architectural") && (title.includes("incomplete") || title.includes("partial"))) {
          tr = codeMatches.find(x => x.key === "107.2");
        } else if (title.includes("eero") || title.includes("escape") || title.includes("sleeping")) {
          tr = codeMatches.find(x => x.key === "R310");
        } else if (title.includes("garage") || title.includes("separation")) {
          tr = codeMatches.find(x => x.key === "R302.6");
        } else if (title.includes("dwelling") || title.includes("unit count")) {
          tr = codeMatches.find(x => x.key === "R202");
        } else if (title.includes("windborne") || title.includes("debris")) {
          tr = codeMatches.find(x => x.key === "1609.2");
        } else if (title.includes("seismic") || title.includes("sdc")) {
          tr = codeMatches.find(x => x.key === "1613");
        } else if (title.includes("wind speed")) {
          tr = codeMatches.find(x => x.key === "1609");
        } else if (title.includes("corrosion") || title.includes("exposed")) {
          tr = codeMatches.find(x => x.key === "amend");
        } else if (title.includes("energy") || title.includes("iecc") || title.includes("climate")) {
          tr = codeMatches.find(x => x.key === "IECC");
        } else if (title.includes("guardrail") || title.includes("guard")) {
          tr = codeMatches.find(x => x.key === "R312");
        } else if (title.includes("illustrative") || title.includes("rendering") || title.includes("construction")) {
          tr = codeMatches.find(x => x.key === "QA_lbl");
        } else if (title.includes("stair") || title.includes("width")) {
          tr = codeMatches.find(x => x.key === "R311.7");
        } else if (title.includes("window") || title.includes("schedule")) {
          tr = codeMatches.find(x => x.key === "QA_win");
        } else if (title.includes("flood")) {
          tr = codeMatches.find(x => x.key === "AppG");
        } else if (title.includes("index") || title.includes("drawing index")) {
          tr = codeMatches.find(x => x.key === "QA");
        }
      }

      if (!tr) {
        // Try mapping direct ID as a last resort
        const mapping = {
          "HF-01": { title: "Falta sello profesional", evidence: "No hay sello/firma/fecha del CIAPR en ningún bloque de título.", explanation: "Los documentos de construcción en Puerto Rico deben llevar el sello y la firma de un profesional licenciado por el Colegio de Ingenieros y Agrimensores de Puerto Rico (CIAPR).", correction: "Aplicar sello, firma y fecha con licencia del CIAPR a cada plano." },
          "HF-02": { title: "Plano arquitectónico incompleto", evidence: "El índice de hojas incluye planos no sometidos.", explanation: "Se requiere un conjunto arquitectónico completo para evaluar los medios de egreso, las separaciones y las disposiciones de seguridad humana.", correction: "Someter el conjunto arquitectónico completo que coincida con el índice." },
          "LF-03": { title: "Discrepancia en el índice de planos", evidence: "El índice incluye planos que no están presentes en el paquete.", explanation: "El índice de planos debe coincidir exactamente con los planos presentados para evitar vacíos en la documentación.", correction: "Conciliar el índice con los planos presentados." },
          "HF-07": { title: "EERO no verificable", evidence: "Dormitorio 2 = Vidrio Fijo 36x72; no se tabuló apertura libre neta.", explanation: "Cada habitación requiere una apertura de escape y rescate de emergencia operable >= 5.7 pies cuadrados, con antepecho <= 44 pulgadas.", correction: "Añadir columnas de apertura libre neta + altura de antepecho; proveer EERO operable que cumpla por dormitorio." },
          "MF-05": { title: "Separación garaje/vivienda incompleta", evidence: "Habitación habitable sobre el garaje; no hay techo de placa de yeso Tipo X de 5/8\".", explanation: "El espacio habitable sobre un garaje requiere una separación de techo de placa de yeso Tipo X de 5/8 de pulgada y penetraciones protegidas.", correction: "Especificar techo de garaje de Tipo X de 5/8\" + penetraciones protegidas." },
          "HF-06": { title: "Cantidad de unidades de vivienda ambigua", evidence: "Segunda cocina + nivel inferior separable; cantidad de unidades no declarada.", explanation: "La cantidad de unidades determina la ruta de código aplicable (PRRC frente a PRBC) y los requisitos de separación.", correction: "Declarar la cantidad de unidades; si son dos unidades, mostrar separación + egreso independiente." },
          "HF-08": { title: "Protección contra escombros arrastrados por el viento no mostrada", evidence: "Gran acristalamiento fijo, sin contraventanas; San Juan está en la región de escombros.", explanation: "Las aperturas acristaladas en la región de escombros arrastrados por el viento requieren vidrio resistente a impactos o protección de apertura probada.", correction: "Añadir un programa de protección de aperturas con presiones de diseño por apertura." },
          "HF-09": { title: "Categoría de diseño sísmico no declarada", evidence: "Las notas indican 'Zona Sísmica C'; no hay Ss/S1 del sitio ni SDC.", explanation: "El sistema lateral y cualquier detalle de hormigón deben diseñarse de acuerdo con la SDC del sitio.", correction: "Proveer Ss/S1, derivar SDC, mostrar sistema lateral + detalles del Capítulo 18 de ACI 318." },
          "MF-01": { title: "Velocidad de viento no basada en PR", evidence: "Las notas indican 76/90 mph; PR es de ~145-170 mph última.", explanation: "La velocidad de viento de diseño última debe cumplir con el mapa de viento de PR (típicamente 145-170 mph).", correction: "Volver a declarar la velocidad de viento de diseño del mapa de PR / Herramienta de Peligros de ASCE 7." },
          "MF-03": { title: "Faltan conectores resistentes a la corrosión", evidence: "Conectores 'STD GALVANIZED' para miembros expuestos.", explanation: "Las enmiendas del código de edificación de Puerto Rico requieren herrajes resistentes a la corrosión para miembros expuestos.", correction: "Actualizar los conectores/anclajes expuestos a la clase de corrosión requerida." },
          "MF-06": { title: "Cumplimiento energético no corresponde a Zona 1A", evidence: "Arrastres de clima frío (carga de nieve en el terreno de 71 psf).", explanation: "El modelado de cumplimiento energético debe ser para la Zona Climática 1A (cálido-húmedo) utilizando objetivos de SHGC.", correction: "Reejecutar el análisis energético para la Zona 1A; eliminar elementos de nieve/clima frío." },
          "HF-05": { title: "Falta diseño de baranda de protección", evidence: "Borde del balcón con caída >30\"; no se proporciona detalle.", explanation: "Se requieren protecciones donde la caída supere las 30 pulgadas; la altura mínima es de 36 pulgadas.", correction: "Añadir detalle de baranda: mínimo 36\", aberturas <4\" de esfera, cargas de 50 plf/200 lb." },
          "LF-04": { title: "Vistas ilustrativas sin etiquetar", evidence: "Vistas de diagramas no etiquetadas como 'no aptas para construcción'.", explanation: "Los planos estructurales esquemáticos deben distinguirse claramente de los detalles de construcción.", correction: "Etiquetar vistas como esquemáticas frente a vistas para construcción." },
          "MF-04": { title: "Ancho de escalera por debajo del mínimo", evidence: "Nota de escalera 'ancho mín 34in'.", explanation: "El ancho mínimo de la escalera según el Código Residencial Internacional es de 36 pulgadas.", correction: "Corregir nota a un ancho libre mínimo de 36\"." },
          "LF-01": { title: "Brecha de numeración en el programa de ventanas", evidence: "Las etiquetas omiten W1-19.", explanation: "Las brechas de numeración en las etiquetas del programa de ventanas pueden indicar componentes faltantes de los planos estructurales.", correction: "Confirmar que no se haya omitido ninguna ventana; renumerar o anotar la brecha." },
          "LF-02": { title: "Falta columna de apertura libre neta", evidence: "El programa carece de columna de apertura libre neta.", explanation: "Se requiere una columna de apertura libre neta en los programas de ventanas para verificar el cumplimiento de los EEROs.", correction: "Añadir una columna de apertura libre neta al programa de ventanas." },
          "MF-02": { title: "Determinación de zona de inundación ausente", evidence: "Parcela costera; no se muestra zona FEMA ni BFE.", explanation: "Las parcelas costeras requieren consideraciones de diseño de inundaciones para resistir olas y fuerzas hidrodinámicas.", correction: "Añadir determinación de inundación; si es SFHA mostrar BFE + ASCE 24." }
        };
        tr = mapping[f.id];
      }

      if (!tr) return f;
      return {
        ...f,
        title: tr.title || f.title,
        evidence: tr.evidence || f.evidence,
        explanation: tr.explanation || f.explanation,
        correction: tr.correction || f.correction
      };
    }

      const [file, setFile] = useState(null);
      const [fileName, setFileName] = useState("");

      const [step, setStep] = useState(-1);
      const fileInputRef = useRef(null);

      const running = step >= 0;

      useEffect(() => {
        if (step < 0) return;
        if (step >= LOADING_STEPS.length) {
          return; // wait for API call to actually update the screen
        }
        const interval = setInterval(() => {
          setStep((s) => s + 1);
        }, 900);
        return () => clearInterval(interval);
      }, [step]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setStep(0);

        const formData = new FormData();
        formData.append("project_name", projectName);
        formData.append("municipality", municipality);
        formData.append("permit_type", permitType);
        formData.append("project_type", projectType);
        formData.append("code_set", codeSetId);
        formData.append("language", language);
        formData.append("mock", useMock ? "true" : "false");
        if (file) {
          formData.append("file", file);
        }

        try {
          const res = await fetch("/api/review", {
            method: "POST",
            body: formData,
          });
          if (!res.ok) {
            throw new Error("API request failed");
          }
          const data = await res.json();
          // Finish the loader step anim instantly
          setStep(LOADING_STEPS.length);
          setTimeout(() => {
            onRun(data);
          }, 400);

          alert("Error running plan review: " + err.message);

                    </div>

    // Interactive Viewer Screen
    function ViewerScreen({ data, onBack, lang, setLang }) {
      const rid = data.review_id;
      const findings = (data.findings || []).map(f => translateFinding(f, lang));
      const manifest = data.manifest;
      const filesBase = data.files_base;

      const [pageNo, setPageNo] = useState(1);
      const [activeId, setActiveId] = useState(findings[0]?.id || "");
      const [hoveredId, setHoveredId] = useState(null);
      const [leftCollapsed, setLeftCollapsed] = useState(false);
      const [rightCollapsed, setRightCollapsed] = useState(false);

      // Zoom and Pan States
      const [zoom, setZoom] = useState(100);
      const [panX, setPanX] = useState(0);
      const [panY, setPanY] = useState(0);
      const [isPanning, setIsPanning] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [spacePressed, setSpacePressed] = useState(false);

      const viewportRef = useRef(null);

      const ZOOM_PRESETS = [25, 50, 75, 100, 125, 150, 175, 200, 300, 400];

      const currentPageManifest = manifest.pages.find(p => p.page === pageNo) || manifest.pages[0];
      const pageMarkers = (currentPageManifest.markers || []).map(m => translateFinding(m, lang));
      const pageImage = `${filesBase}/${currentPageManifest.image}`;

      const sel = findings.find(f => f.id === activeId) || findings[0];

      const getPresetIndex = (z) => {
        let closest = 0;
        let diff = Math.abs(ZOOM_PRESETS[0] - z);
        for (let i = 1; i < ZOOM_PRESETS.length; i++) {
          let d = Math.abs(ZOOM_PRESETS[i] - z);
          if (d < diff) {
            diff = d;
            closest = i;
          }
        }
        return closest;
      };

      // Spacebar panning keys listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === "Space") {
            if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") return;
            setSpacePressed(true);
            e.preventDefault();
          }
        };
        const handleKeyUp = (e) => {
          if (e.code === "Space") {
            setSpacePressed(false);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("keyup", handleKeyUp);
        return () => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("keyup", handleKeyUp);
        };
      }, []);

      // Smooth zoom on Ctrl/Cmd+wheel or pinch — NO auto-zoom on plain scroll
      useEffect(() => {
        const viewport = viewportRef.current;
        if (!viewport) return;
        let accumDelta = 0;
        let debounceTimer = null;

        const handleWheel = (e) => {
          // Only zoom when Ctrl/Cmd is held (pinch gesture or Ctrl+scroll)
          if (!e.ctrlKey && !e.metaKey) return;
          e.preventDefault();

          // Accumulate delta for smooth trackpad gestures
          accumDelta += e.deltaY;
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => { accumDelta = 0; }, 150);

          // Apply zoom in ±5% steps with a threshold to avoid micro-jumps
          if (Math.abs(accumDelta) > 15) {
            const step = accumDelta < 0 ? 5 : -5;
            setZoom(prev => Math.max(10, Math.min(400, prev + step)));
            accumDelta = 0;
          }
        };

        viewport.addEventListener("wheel", handleWheel, { passive: false });
        return () => {
          clearTimeout(debounceTimer);
          viewport.removeEventListener("wheel", handleWheel);
        };
      }, []);

      // Center viewport on a finding marker.
      // pageManifest defaults to currentPageManifest (same-page clicks),
      // but must be passed explicitly when navigating to a different page.
      const centerOnMarker = (f, targetZoom = zoom, pageManifest = null) => {
        if (!f || !viewportRef.current) return;

        setTimeout(() => {
          if (!viewportRef.current) return;
          const rect = viewportRef.current.getBoundingClientRect();
          const containerW = rect.width;
          const containerH = rect.height;

          // Resolve page dimensions — use explicit manifest if provided
          // (avoids stale closure when navigating between pages)
          const pm = pageManifest ||
            manifest.pages.find(p => p.page === f.page) ||
            manifest.pages[0];
          const pageW = pm.width || 792;
          const pageH = pm.height || 612;

          // The panning div geometry:
          //   imgW = containerW * (targetZoom / 100)   ← driven by width: ${zoom}%
          //   imgH = imgW * (pageH / pageW)            ← driven by aspectRatio
          const imgW = containerW * (targetZoom / 100);
          const imgH = imgW * (pageH / pageW);

          const [x0, y0, x1, y1] = f.bbox || [0.5, 0.5, 0.5, 0.5];
          const cx = (x0 + x1) / 2;
          const cy = (y0 + y1) / 2;

          // Pan so the finding center appears at the viewport center
          const targetPanX = containerW / 2 - cx * imgW;
          const targetPanY = containerH / 2 - cy * imgH;

          setPanX(targetPanX);
          setPanY(targetPanY);
        }, 60);
      };

      // Zoom helpers
      const changeZoom = (newZoom) => {
        setZoom(newZoom);
        if (sel) {
          centerOnMarker(sel, newZoom);
        }
      };

      const handleZoomIn = () => {
        const idx = getPresetIndex(zoom);
        if (idx < ZOOM_PRESETS.length - 1) {
          changeZoom(ZOOM_PRESETS[idx + 1]);
        }
      };

      const handleZoomOut = () => {
        const idx = getPresetIndex(zoom);
        if (idx > 0) {
          changeZoom(ZOOM_PRESETS[idx - 1]);
        }
      };

      const handleFitWidth = () => {
        // At zoom=100% the div fills the container width.
        // To fit PAGE HEIGHT in the viewport we need a zoom < 100 for portrait pages.
        if (!viewportRef.current) return;
        const vRect = viewportRef.current.getBoundingClientRect();
        const pageW = currentPageManifest.width || 792;
        const pageH = currentPageManifest.height || 612;
        // imgW = vRect.width * (zoom/100), imgH = imgW * pageH/pageW
        // We want imgH = vRect.height → zoom = vRect.height / (vRect.width * pageH/pageW) * 100
        const targetZoom = Math.round((vRect.height / (vRect.width * pageH / pageW)) * 100);
        setZoom(Math.min(targetZoom, 400));
        setPanX(0);
        setPanY(0);
      };

      const handleFitPage = () => {
        setZoom(100);
        setPanX(0);
        setPanY(0);
      };

      const handleActualSize = () => {
        changeZoom(100);
        setPanX(0);
        setPanY(0);
      };

      const handleResetView = () => {
        setZoom(100);
        setPanX(0);
        setPanY(0);
      };

      // Panning drag handlers
      const handleMouseDown = (e) => {
        if (spacePressed || e.button === 0) {
          setIsPanning(true);
          setDragStart({ x: e.clientX, y: e.clientY });
          setPanStart({ x: panX, y: panY });
          e.preventDefault();
        }
      };

      const handleMouseMove = (e) => {
        if (!isPanning) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        setPanX(panStart.x + dx);
        setPanY(panStart.y + dy);
      };

      const handleMouseUp = () => {
        setIsPanning(false);
      };

      // Minimap: what fraction of the panning div is visible in the viewport?
      const getMinimapViewport = () => {
        if (!viewportRef.current) return { left: 0, top: 0, width: 100, height: 100 };
        const vRect = viewportRef.current.getBoundingClientRect();
        const pageW = currentPageManifest.width || 792;
        const pageH = currentPageManifest.height || 612;

        // Panning div true pixel dimensions
        const imgW = vRect.width * (zoom / 100);
        const imgH = imgW * (pageH / pageW);

        const wFrac = vRect.width / imgW;
        const hFrac = vRect.height / imgH;
        const leftFrac = -panX / imgW;
        const topFrac = -panY / imgH;

        return {
          left: Math.max(0, Math.min(100, leftFrac * 100)),
          top: Math.max(0, Math.min(100, topFrac * 100)),
          width: Math.max(5, Math.min(100, wFrac * 100)),
          height: Math.max(5, Math.min(100, hFrac * 100)),
        };
      };

      const minimapViewport = getMinimapViewport();

      const handleMinimapClick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) / rect.width;
        const clickY = (e.clientY - rect.top) / rect.height;

        if (!viewportRef.current) return;
        const vRect = viewportRef.current.getBoundingClientRect();
        const pageW = currentPageManifest.width || 792;
        const pageH = currentPageManifest.height || 612;

        const imgW = vRect.width * (zoom / 100);
        const imgH = imgW * (pageH / pageW);

        setPanX(vRect.width / 2 - clickX * imgW);
        setPanY(vRect.height / 2 - clickY * imgH);
      };

      // Handle click on a map pin — select + center, right panel shows details
      const handleMarkerClick = (fid) => {
        setActiveId(fid);
        const f = findings.find(x => x.id === fid);
        if (f) centerOnMarker(f);
      };

      // Keyboard navigation: left/right arrows cycle through findings
      useEffect(() => {
        const handleKey = (e) => {
          if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
            e.preventDefault();
            const idx = findings.findIndex(f => f.id === activeId);
            const next = findings[(idx + 1) % findings.length];
            if (next) selectFinding(next);
          } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
            e.preventDefault();
            const idx = findings.findIndex(f => f.id === activeId);
            const prev = findings[(idx - 1 + findings.length) % findings.length];
            if (prev) selectFinding(prev);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [activeId, findings]);

      // Select page and synchronize active finding
      const selectPage = (p) => {
        setPageNo(p);
        setOpenCalloutId(null);
        const pManifest = manifest.pages.find(pm => pm.page === p);
        if (pManifest && pManifest.markers && pManifest.markers.length > 0) {
          setActiveId(pManifest.markers[0].id);
        }
      };

      // Select finding: navigate page, zoom in, center — Bluebeam-style
      const selectFinding = (f) => {
        setActiveId(f.id);

        // Resolve the target page manifest NOW (not inside a stale closure)
        const targetPageManifest =
          manifest.pages.find(pm => pm.page === f.page) || manifest.pages[0];

        // 1. Zoom out to fit
        setZoom(100);
        setPanX(0);
        setPanY(0);

        setTimeout(() => {
          // 2. Switch page
          setPageNo(f.page);

          setTimeout(() => {
            // 3. Zoom back in and center precisely on the finding
            setZoom(175);
            centerOnMarker(f, 175, targetPageManifest);
          }, 280);
        }, 220);
      };

      return (
        <div className="flex-1 flex flex-col overflow-hidden">
          <main className="flex-1 flex items-stretch gap-4 p-4 relative overflow-hidden">

                }}>

                    <ul className="space-y-2.5">
                      {manifest.pages.map((p) => {
                        const thumbUrl = `${filesBase}/${p.thumb}`;
                        const findingsCount = findings.filter(f => f.page === p.page).length;

                        return (
                          <li key={p.page}>

                              onClick={() => selectPage(p.page)}
                              className={`relative block w-full rounded-lg border p-1 transition overflow-hidden ${pageNo === p.page ? 'border-teal-700 ring-2 ring-teal-700 bg-teal-50/10' : 'border-gray-200 bg-white hover:border-gray-300'}`}
                            >
                              <div className="relative bg-gray-50 border border-gray-100 rounded" style={{ aspectRatio: "11/8.5" }}>
                                <img src={thumbUrl} className="w-full h-full object-contain pointer-events-none" />
                                {findingsCount > 0 && (
                                  <span className={`absolute -top-1 -left-1 inline-flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-[10px] font-bold text-white shadow-sm border border-white ${hasHigh ? 'bg-red-600' : 'bg-amber-500'}`}>
                                    {findingsCount}
                                  </span>
                                )}
                              </div>
                              <span className="mt-1 block text-center text-[10px] font-bold text-gray-500 font-mono leading-none">p{p.page} ({p.label})</span>
                            </button>
                          </li>
                        );
                      })}
                    </ul>
                  </div>
                </div>
                {/* Left collapse toggle button */}
                <button
                  onClick={() => setLeftCollapsed(c => !c)}
                  title={leftCollapsed ? 'Show drawings panel' : 'Hide drawings panel'}
                  style={{
                    position: 'absolute', top: 12,
                    right: leftCollapsed ? -28 : -14,
                    zIndex: 40,
                    background: 'white',
                    border: '1px solid #e2e8f0',
                    borderRadius: '0 6px 6px 0',
                    padding: '10px 4px',
                    cursor: 'pointer',
                    boxShadow: '2px 0 8px rgba(0,0,0,0.08)',
                    transition: 'right 0.25s cubic-bezier(0.4,0,0.2,1)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#64748b', fontSize: 14, lineHeight: 1,
                    userSelect: 'none',
                  }}
                >
                  {leftCollapsed ? '›' : '‹'}
                </button>
              </div>

              {/* ── CENTER PANEL: Drawing canvas ── */}
              <div className="rounded-xl border border-gray-200 bg-gray-200 shadow-inner flex flex-col justify-between items-stretch gap-0 relative overflow-hidden min-h-[500px] flex-1">
                {/* Page header controls */}
                <div className="flex items-center justify-between px-4 py-2 border-b bg-white select-none">
                  <div className="flex items-center gap-2 border px-2 py-1 rounded bg-gray-50 text-xs font-semibold">
                    <button onClick={() => selectPage(Math.max(1, pageNo - 1))} className="text-gray-500 hover:text-teal-700 transition"><Icons.ChevronLeft size={16} /></button>
                    <span className="text-gray-800 font-bold px-1.5 font-mono">{currentPageManifest.label}</span>
                    <button onClick={() => selectPage(Math.min(manifest.page_count, pageNo + 1))} className="text-gray-500 hover:text-teal-700 transition"><Icons.ChevronRight size={16} /></button>
                  </div>
                  <span className="text-xs font-semibold text-gray-500 font-mono leading-none">
                    {pageMarkers.length} {pageMarkers.length === 1 ? TRANSLATIONS[lang].markersOnSheet : TRANSLATIONS[lang].markersOnSheetPlural}
                  </span>
                </div>

                {/* Zoom Toolbar */}
                <div className="flex flex-wrap items-center gap-3 bg-white px-4 py-2 border-b border-gray-200 select-none text-xs font-semibold">
                  <div className="flex items-center gap-1 border-r pr-3 mr-1">
                    <button
                      onClick={handleZoomOut}
                      className="px-2 py-1 bg-gray-50 hover:bg-gray-100 rounded border border-gray-300 text-gray-700 transition"
                      title={TRANSLATIONS[lang].zoomOut}
                    >
                      {TRANSLATIONS[lang].zoomOut}
                    </button>
                    <span className="w-12 text-center font-mono font-bold text-gray-700">
                      {zoom}%
                    </span>
                    <button
                      onClick={handleZoomIn}
                      className="px-2 py-1 bg-gray-50 hover:bg-gray-100 rounded border border-gray-300 text-gray-700 transition"

                      {TRANSLATIONS[lang].zoomIn}
                    </button>
                  </div>

                  {/* Zoom Slider */}
                  <div className="flex items-center gap-2 border-r pr-4 mr-1">
                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">{TRANSLATIONS[lang].sliderLabel}</span>
                    <input
                      type="range"
                      min="0"
                      max={ZOOM_PRESETS.length - 1}
                      value={getPresetIndex(zoom)}
                      onChange={(e) => changeZoom(ZOOM_PRESETS[parseInt(e.target.value)])}

                    />
                  </div>

                  {/* Preset Actions */}
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={handleFitWidth}
                      className="px-2.5 py-1 hover:bg-gray-50 border border-gray-300 rounded text-gray-700 transition"
                    >
                      {TRANSLATIONS[lang].fitWidth}
                    </button>
                    <button
                      onClick={handleFitPage}
                      className="px-2.5 py-1 hover:bg-gray-50 border border-gray-300 rounded text-gray-700 transition"

                      {TRANSLATIONS[lang].fitPage}
                    </button>
                    <button
                      onClick={handleActualSize}
                      className="px-2.5 py-1 hover:bg-gray-50 border border-gray-300 rounded text-gray-700 transition"
                    >

                    </button>
                    <button
                      onClick={handleResetView}
                      className="px-2.5 py-1 hover:bg-gray-50 border border-gray-300 rounded text-gray-700 transition"

                    </button>

                  <div className="ml-auto text-[10px] text-gray-400 font-bold uppercase tracking-wider flex items-center gap-1.5">
                    <span>{TRANSLATIONS[lang].panLabel}</span>
                    <span className="h-1.5 w-1.5 rounded-full bg-teal-500 animate-pulse" />
                  </div>
                </div>

                {/* Drawing Viewport Box */}
                <div
                  ref={viewportRef}
                  className={`relative flex-1 overflow-hidden select-none outline-none ${spacePressed ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'}`}
                  onMouseDown={handleMouseDown}
                  onMouseMove={handleMouseMove}
                  onMouseUp={handleMouseUp}
                  onMouseLeave={handleMouseUp}
                >
                  {/* Panning wrapper — aspect ratio matches the ACTUAL page dimensions
                      so pins positioned at cx*100%, cy*100% map 1:1 to image content */}
                  <div
                    className="relative origin-top-left bg-white shadow-lg border border-gray-300 rounded"
                    style={{
                      transform: `translate(${panX}px, ${panY}px)`,
                      width: `${zoom}%`,
                      transition: isPanning ? 'none' : 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1)',
                      aspectRatio: `${currentPageManifest.width || 792} / ${currentPageManifest.height || 612}`
                    }}
                  >
                    <img src={pageImage} className="w-full h-full object-fill pointer-events-none" />

                    {/* ── Scope rectangle + SVG crosshair/arrow for ACTIVE marker ── */}
                    {pageMarkers.map((m) => {
                      if (m.id !== activeId) return null;
                      const [x0, y0, x1, y1] = m.bbox;
                      const bw = x1 - x0;
                      const bh = y1 - y0;
                      if (bw < 0.005 || bh < 0.005) return null;
                      let scopeClr = "#dc2626";
                      if (m.severity === "Medium") scopeClr = "#d97706";
                      if (m.severity === "Low") scopeClr = "#6b7280";
                      const cx = (x0 + x1) / 2;
                      const cy = (y0 + y1) / 2;
                      // Crosshair arm lengths (in % of image size)
                      const ARM_H = Math.max(bw * 0.45, 0.025);
                      const ARM_V = Math.max(bh * 0.45, 0.035);
                      return (
                        <React.Fragment key={`scope-${m.id}`}>
                          {/* Scope border rectangle */}
                          <div
                            className="absolute pointer-events-none z-20"
                            style={{
                              left: `${x0 * 100}%`,
                              top: `${y0 * 100}%`,
                              width: `${bw * 100}%`,
                              height: `${bh * 100}%`,
                              border: `2px solid ${scopeClr}`,
                              borderRadius: 2,
                              boxShadow: `0 0 0 1px rgba(255,255,255,0.6), inset 0 0 0 1px rgba(255,255,255,0.3)`,
                              background: `${scopeClr}14`,
                            }}
                          />
                          {/* SVG crosshair + corner arrows */}
                          <svg
                            className="absolute inset-0 w-full h-full pointer-events-none z-25"
                            xmlns="http://www.w3.org/2000/svg"
                            overflow="visible"
                          >
                            <defs>
                              <marker id={`arr-${m.id}`} viewBox="0 0 8 8" refX="4" refY="4"
                                markerWidth="5" markerHeight="5" orient="auto">
                                <path d="M0,0 L8,4 L0,8 Z" fill={scopeClr} />
                              </marker>
                              <marker id={`arr2-${m.id}`} viewBox="0 0 8 8" refX="4" refY="4"
                                markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                <path d="M0,0 L8,4 L0,8 Z" fill={scopeClr} />
                              </marker>
                            </defs>

                            {/* Horizontal crosshair line (dashed, through center) */}
                            <line
                              x1={`${(cx - ARM_H) * 100}%`} y1={`${cy * 100}%`}
                              x2={`${(cx + ARM_H) * 100}%`} y2={`${cy * 100}%`}
                              stroke={scopeClr} strokeWidth="1.2"
                              strokeDasharray="4 2.5" opacity="0.8"
                            />
                            {/* Vertical crosshair line (dashed, through center) */}
                            <line
                              x1={`${cx * 100}%`} y1={`${(cy - ARM_V) * 100}%`}
                              x2={`${cx * 100}%`} y2={`${(cy + ARM_V) * 100}%`}
                              stroke={scopeClr} strokeWidth="1.2"
                              strokeDasharray="4 2.5" opacity="0.8"
                            />
                            {/* Vertical leader arrow coming DOWN from ABOVE the scope rect */}
                            <line
                              x1={`${cx * 100}%`}
                              y1={`${Math.max(0, y0 * 100 - 4)}%`}
                              x2={`${cx * 100}%`}
                              y2={`${(y0 + bh * 0.18) * 100}%`}
                              stroke={scopeClr} strokeWidth="2"
                              markerEnd={`url(#arr-${m.id})`}
                              strokeLinecap="round"
                            />
                            {/* Center bullseye dot */}
                            <circle cx={`${cx * 100}%`} cy={`${cy * 100}%`} r="4"
                              fill="white" stroke={scopeClr} strokeWidth="2" />
                            <circle cx={`${cx * 100}%`} cy={`${cy * 100}%`} r="1.5"
                              fill={scopeClr} />
                          </svg>
                        </React.Fragment>
                      );
                    })}

                    {/* ── Circular pin markers ── */}
                    {pageMarkers.map((m) => {
                      const [x0, y0, x1, y1] = m.bbox;
                      const cx = (x0 + x1) / 2;
                      const cy = (y0 + y1) / 2;
                      const active = m.id === activeId;
                      const hovered = m.id === hoveredId;

                      let pinBg = "#dc2626"; // High = red
                      if (m.severity === "Medium") pinBg = "#d97706";
                      if (m.severity === "Low") pinBg = "#6b7280";

                      return (
                        <div
                          key={m.id}
                          className="absolute z-30"
                          style={{
                            left: `${cx * 100}%`,
                            top: `${cy * 100}%`,
                            transform: 'translate(-50%, -50%)',
                          }}
                          onMouseEnter={() => setHoveredId(m.id)}
                          onMouseLeave={() => setHoveredId(null)}
                        >
                          {/* Pulsing ring on active pin */}
                          {active && (
                            <span
                              className="absolute inset-0 rounded-full"
                              style={{
                                animation: 'pinPulse 1.6s cubic-bezier(0.4,0,0.6,1) infinite',
                                background: pinBg,
                                opacity: 0.35,
                                transform: 'scale(2)',
                              }}
                            />
                          )}

                          {/* The pin button */}
                          <button
                            onClick={() => handleMarkerClick(m.id)}
                            title={m.title}
                            style={{
                              background: pinBg,
                              width: active ? 30 : 26,
                              height: active ? 30 : 26,
                              border: active ? '2.5px solid white' : '2px solid rgba(255,255,255,0.85)',
                              borderRadius: '50%',
                              boxShadow: active
                                ? `0 0 0 2px ${pinBg}, 0 3px 10px rgba(0,0,0,0.4)`
                                : '0 1px 5px rgba(0,0,0,0.35)',
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                              cursor: 'pointer',
                              transition: 'all 0.18s ease',
                              flexShrink: 0,
                              position: 'relative',
                            }}
                          >
                            <span style={{
                              fontFamily: 'monospace', fontWeight: 800,
                              fontSize: m.id.length > 4 ? 7.5 : 9,
                              color: 'white', letterSpacing: '-0.5px',
                              lineHeight: 1, userSelect: 'none',
                            }}>
                              {m.id}
                            </span>
                          </button>

                          {/* Hover tooltip */}
                          {hovered && !active && (
                            <div style={{
                              position: 'absolute', bottom: 'calc(100% + 6px)',
                              left: '50%', transform: 'translateX(-50%)',
                              background: 'rgba(15,23,42,0.95)', color: 'white',
                              fontSize: 11, fontWeight: 500,
                              padding: '4px 8px', borderRadius: 5,
                              whiteSpace: 'nowrap', zIndex: 50,
                              boxShadow: '0 2px 8px rgba(0,0,0,0.3)',
                              pointerEvents: 'none',
                            }}>
                              <span style={{ fontFamily: 'monospace', fontWeight: 700, marginRight: 4 }}>{m.id}</span>
                              {m.title}
                              <div style={{
                                position: 'absolute', top: '100%', left: '50%',
                                transform: 'translateX(-50%)',
                                border: '5px solid transparent',
                                borderTopColor: 'rgba(15,23,42,0.95)',
                              }} />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Minimap Overlay inside viewport container */}
                  <div
                    className="absolute top-4 right-4 z-20 w-36 aspect-[11/8.5] bg-white border border-gray-300 rounded shadow-md overflow-hidden cursor-pointer select-none"
                    onClick={handleMinimapClick}
                  >
                    <img src={pageImage} className="w-full h-full object-contain opacity-60 pointer-events-none" />

                    {/* Markers on Minimap */}
                    {pageMarkers.map((m) => {
                      const [x0, y0, x1, y1] = m.bbox;
                      const cx = (x0 + x1) / 2;
                      const cy = (y0 + y1) / 2;
                      return (
                        <div
                          key={m.id}
                          className="absolute w-1.5 h-1.5 rounded-full bg-red-600 border border-white -translate-x-1/2 -translate-y-1/2"
                          style={{ left: `${cx * 100}%`, top: `${cy * 100}%` }}
                        />
                      );
                    })}

                    {/* Viewport Indicator on Minimap */}
                    <div
                      className="absolute border border-teal-600 bg-teal-600/10 pointer-events-none"
                      style={{
                        left: `${minimapViewport.left}%`,
                        top: `${minimapViewport.top}%`,
                        width: `${minimapViewport.width}%`,
                        height: `${minimapViewport.height}%`,
                      }}
                    />
                  </div>
                </div>
              </div>

              {/* ── RIGHT SIDEBAR: collapsible annotation detail + findings list ── */}
              <div style={{ position: 'relative', flexShrink: 0 }}>
                {/* Right collapse toggle button */}
                <button
                  onClick={() => setRightCollapsed(c => !c)}
                  title={rightCollapsed ? 'Show details panel' : 'Hide details panel'}
                  style={{
                    position: 'absolute', top: 12,
                    left: rightCollapsed ? -28 : -14,
                    zIndex: 40,
                    background: 'white',
                    border: '1px solid #e2e8f0',
                    borderRadius: '6px 0 0 6px',
                    padding: '10px 4px',
                    cursor: 'pointer',
                    boxShadow: '-2px 0 8px rgba(0,0,0,0.08)',
                    transition: 'left 0.25s cubic-bezier(0.4,0,0.2,1)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#64748b', fontSize: 14, lineHeight: 1,
                    userSelect: 'none',
                  }}
                >
                  {rightCollapsed ? '‹' : '›'}
                </button>
                {/* Panel content wrapper */}
                <div style={{
                  width: rightCollapsed ? 0 : 330,
                  overflow: 'hidden',
                  transition: 'width 0.25s cubic-bezier(0.4,0,0.2,1)',
                  flexShrink: 0,
                }}>
                  <div style={{ width: 320 }} className="flex flex-col gap-4 self-stretch max-h-[calc(100vh-140px)] overflow-y-auto">
                    {/* Active Annotation Detail Card */}
                    {sel && (
                      <div className="rounded-xl border border-gray-200 bg-white shadow-md">
                        <div className="border-b border-gray-200 px-4 py-3 flex items-center justify-between select-none">
                          <span className="text-xs font-bold text-gray-900">{TRANSLATIONS[lang].activeAnnotationDetails}</span>
                          <span className="font-mono text-xs font-bold text-teal-700">{sel.id}</span>
                        </div>
                        <div className="p-4 space-y-3">
                          <div className="flex items-center gap-2">
                            <span className={`inline-flex items-center gap-1 rounded border px-1.5 py-0.5 text-[9px] font-bold ${SEV_STYLE[sel.severity].chip}`}>
                              <span className={`h-1.5 w-1.5 rounded-full ${SEV_STYLE[sel.severity].dot}`} />
                              {sel.severity === "High" ? (lang === "en" ? "High" : "Alto") : sel.severity === "Medium" ? (lang === "en" ? "Medium" : "Medio") : (lang === "en" ? "Low" : "Bajo")}
                            </span>
                            <h4 className="text-xs font-bold text-gray-900 leading-snug">{sel.title}</h4>
                          </div>
                          <div className="grid grid-cols-2 gap-2 text-[11px] font-semibold border-b border-gray-100 pb-2">
                            <div>
                              <dt className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{TRANSLATIONS[lang].sheetPage}</dt>
                              <dd className="text-gray-700 mt-0.5">p{sel.page} • {sel.sheet || 'N/A'}</dd>
                            </div>
                            <div>
                              <dt className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{TRANSLATIONS[lang].ruleCode}</dt>
                              <dd className="text-teal-700 font-mono mt-0.5">{sel.code}</dd>
                            </div>
                          </div>
                          <div>
                            <dt className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{TRANSLATIONS[lang].evidenceLabel}</dt>
                            <dd className="text-xs text-gray-700 mt-1 leading-relaxed bg-gray-50 border p-2 rounded-lg">{sel.evidence}</dd>
                          </div>
                          <div>
                            <dt className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{TRANSLATIONS[lang].correctionLabel}</dt>
                            <dd className="text-xs text-emerald-800 font-medium mt-1 leading-relaxed bg-emerald-50/50 border border-emerald-100 p-2.5 rounded-lg">{sel.correction}</dd>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* All findings shortcuts */}
                    <div className="rounded-xl border border-gray-200 bg-white shadow-md flex-1 flex flex-col min-h-[200px]">
                      <div className="border-b border-gray-200 px-4 py-3 select-none flex items-center justify-between">
                        <span className="text-xs font-bold text-gray-900">{TRANSLATIONS[lang].allFindings}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] text-gray-400 font-medium hidden sm:block">{TRANSLATIONS[lang].keysToNavigate}</span>
                          <span className="inline-flex items-center justify-center bg-gray-100 text-gray-600 rounded-full text-[10px] font-bold w-5 h-5">{findings.length}</span>
                        </div>
                      </div>
                      <ul className="divide-y divide-gray-100 overflow-y-auto flex-1 max-h-[300px]">
                        {findings.map((f) => (
                          <li key={f.id}>
                            <button
                              onClick={() => selectFinding(f)}
                              className={`w-full text-left px-4 py-2.5 flex items-center gap-3 hover:bg-gray-50/50 transition ${activeId === f.id ? "bg-teal-50/30 font-bold border-l-4 border-teal-700" : "border-l-4 border-transparent"}`}
                            >
                              <span className={`h-2.5 w-2.5 rounded-full shrink-0 ${SEV_STYLE[f.severity].dot}`} />
                              <span className="font-mono text-xs text-gray-400 w-12 shrink-0">{f.id}</span>
                              <span className="text-xs text-gray-700 truncate flex-1">{f.title}</span>
                              <span className="text-[10px] text-gray-400 font-bold font-mono">p{f.page}</span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }

    // History Screen — lists previous submissions from /api/reviews
    function HistoryScreen({ onNav, onLoadReview, lang, setLang }) {
      const [reviews, setReviews] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        (async () => {
          try {
            const res = await fetch("/api/reviews");
            if (res.ok) {
              const data = await res.json();
              setReviews(data);
            }
          } catch (err) {
            console.error("Failed to load reviews", err);
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      const handleLoad = async (rid) => {
        try {
          const res = await fetch(`/api/reviews/${rid}/load`);
          if (res.ok) {
            const data = await res.json();
            onLoadReview(data);
          }
        } catch (err) {
          alert("Failed to load review: " + err.message);
        }
      };

      const formatDate = (ts) => {
        try {
          return new Date(ts * 1000).toLocaleDateString("en-US", {
            month: "short", day: "numeric", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          });
        } catch { return "—"; }
      };      return (
        <div className="flex-1 flex flex-col">
          <main className="mx-auto max-w-4xl w-full px-4 py-8 flex-1">
            <h2 className="text-xl font-bold text-gray-900">{TRANSLATIONS[lang].submissionHistory}</h2>
            <p className="text-xs text-gray-500 font-semibold uppercase tracking-wider mt-0.5">{TRANSLATIONS[lang].submissionHistorySub}</p>

            {loading ? (
              <div className="mt-12 flex justify-center">
                <Icons.Loader2 size={28} className="text-teal-600" />
              </div>
            ) : reviews.length === 0 ? (
              <div className="mt-12 text-center">
                <p className="text-sm text-gray-400 font-medium">{TRANSLATIONS[lang].noSubmissions}</p>
                <button onClick={() => onNav("upload")} className="mt-4 inline-flex items-center gap-2 rounded-lg bg-teal-700 hover:bg-teal-800 text-white font-bold px-5 py-2.5 text-sm transition shadow-sm">
                  <Icons.Upload size={16} /> {TRANSLATIONS[lang].startNewReview}
                </button>
              </div>
            ) : (
              <ul className="mt-6 space-y-3">
                {reviews.map((r) => {
                  const score = r.result?.readiness_score ?? "—";
                  const status = r.result?.status || "";
                  const isReady = typeof score === "number" && score >= 70;
                  return (
                    <li key={r.id}>
                      <button
                        onClick={() => handleLoad(r.id)}
                        className="w-full text-left rounded-xl border border-gray-200 bg-white p-5 hover:border-teal-300 hover:shadow-md transition flex items-center gap-5"
                      >
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-bold text-gray-900 truncate">{r.project?.name || r.id}</p>
                          <p className="text-xs text-gray-400 mt-0.5">
                            {r.project?.municipality || ""} · {r.project?.permit_type === "Construction" ? (lang === "en" ? "Construction" : "Construcción") : (lang === "en" ? "Use" : "Uso")} · {formatDate(r.mtime)}
                          </p>
                        </div>
                        <div className="flex items-center gap-4 shrink-0">
                          <div className="text-center">
                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">{TRANSLATIONS[lang].findings}</span>
                            <span className="text-lg font-bold text-gray-900">{r.findings_count}</span>
                          </div>
                          <div className="text-center">
                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">{TRANSLATIONS[lang].score}</span>
                            <span className={`text-lg font-bold ${isReady ? "text-emerald-700" : "text-red-700"}`}>{score}</span>
                          </div>
                          <span className={`inline-flex items-center gap-1 rounded-lg border px-2 py-0.5 text-[10px] font-bold ${isReady ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-red-200 bg-red-50 text-red-700'}`}>
                            {isReady ? <Icons.CheckCircle2 size={10} /> : <Icons.AlertTriangle size={10} />}
                            {status || (isReady ? (lang === "en" ? "READY" : "LISTO") : (lang === "en" ? "NOT READY" : "NO LISTO"))}
                          </span>
                        </div>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </main>
        </div>
      );
    }

    // App Wrapper
    function App() {
      const [screen, setScreen] = useState("upload");
      const [lang, setLang] = useState("en");
      const [codeSets, setCodeSets] = useState([
        { id: "prrc_2018", name: "PRRC 2018" },
        { id: "prbc_2018", name: "PRBC 2018" },
        { id: "unified_pr", name: "Unified Puerto Rico Code" }
      ]);
      const [reviewData, setReviewData] = useState(null);
      const [generatingPDF, setGeneratingPDF] = useState(false);

      useEffect(() => {
        const fetchCodeSets = async () => {
          try {
            const res = await fetch("/api/code-sets");
            if (res.ok) {
              const data = await res.json();
              if (data && data.length > 0) {
                setCodeSets(data);
              }
            }
          } catch (err) {
            console.error("Failed to load code sets", err);
          }
        };
        fetchCodeSets();
      }, []);

      const handleNav = (target) => {
        if ((target === "results" || target === "viewer") && !reviewData) {
          alert("Please submit a plan review first, or load one from History.");
          return;
        }
        setScreen(target);
      };

      const handleRun = (data) => {
        setReviewData(data);
        setScreen("results");
      };

      const handleLoadReview = (data) => {
        setReviewData(data);
        setScreen("results");
      };

      const handleDownloadNotice = async () => {
        if (!reviewData) return;
        const rid = reviewData.review_id;
        setGeneratingPDF(true);
        try {
          const res = await fetch(`/api/reviews/${rid}/generate-report?lang=${lang}`, {
            method: "POST"
          });
          if (!res.ok) {
            throw new Error("Failed to generate PDF report from server");
          }
          const payload = await res.json();
          const a = document.createElement("a");
          a.href = payload.report_url;
          a.download = payload.file_name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (err) {
          alert("Error generating correction notice PDF: " + err.message);
        } finally {
          setGeneratingPDF(false);
        }
      };

      const handleDownloadAnnotatedPdf = async () => {
        if (!reviewData) return;
        const rid = reviewData.review_id;
        setGeneratingPDF(true); // Reuse the same loading state for simplicity or create a new one, actually let's just use it
        try {
          const res = await fetch(`/api/reviews/${rid}/generate-annotated-pdf?lang=${lang}`, {
            method: "POST"
          });
          if (!res.ok) {
            throw new Error("Failed to generate annotated PDF from server");
          }
          const payload = await res.json();
          const a = document.createElement("a");
          a.href = payload.report_url;
          a.download = payload.file_name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (err) {
          alert("Error generating annotated PDF: " + err.message);
        } finally {
          setGeneratingPDF(false);
        }
      };

      const handleExportJSON = () => {
        if (!reviewData) return;
        const rid = reviewData.review_id;
        const jsonStr = JSON.stringify(reviewData, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `findings-${rid}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const renderRight = () => {
        if (screen === "results" && reviewData) {
          const pdfUrl = `${reviewData.files_base}/annotated.pdf`;
          return (
            <>
              <button onClick={handleDownloadNotice} disabled={generatingPDF} className="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 font-bold px-3 py-1.5 text-xs text-gray-700 transition shadow-sm disabled:opacity-50">
                {generatingPDF ? <Icons.Loader2 size={13} className="animate-spin" /> : <Icons.Download size={13} />}
                {TRANSLATIONS[lang].downloadNoticePdf}
              </button>
              <button onClick={handleDownloadAnnotatedPdf} disabled={generatingPDF} className="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 font-bold px-3 py-1.5 text-xs text-gray-700 transition shadow-sm disabled:opacity-50">
                {generatingPDF ? <Icons.Loader2 size={13} className="animate-spin" /> : <Icons.Download size={13} />}
                {TRANSLATIONS[lang].downloadAnnotatedPdf}
              </button>
              <button onClick={handleExportJSON} className="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 font-bold px-3 py-1.5 text-xs text-gray-700 transition shadow-sm">
                <Icons.FileJson size={13} /> {TRANSLATIONS[lang].json || "JSON"}
              </button>
              <button onClick={() => setScreen("viewer")} className="inline-flex items-center gap-1.5 rounded-lg bg-teal-700 hover:bg-teal-800 font-bold px-3.5 py-1.5 text-xs text-white transition shadow-sm">
                <Icons.FileText size={13} /> {TRANSLATIONS[lang].openViewer}
              </button>
            </>
          );
        } else if (screen === "viewer" && reviewData) {
          const pdfUrl = `${reviewData.files_base}/annotated.pdf`;
          const findingsCount = reviewData.findings.length;
          return (
            <div className="flex items-center gap-3">
              <span className="text-xs text-gray-400 font-bold uppercase tracking-wider">
                {reviewData.project.name} &middot; {findingsCount} {findingsCount === 1 ? (lang === "en" ? "Finding" : "Hallazgo") : (lang === "en" ? "Findings" : "Hallazgos")}
              </span>
              <button onClick={handleDownloadAnnotatedPdf} disabled={generatingPDF} className="inline-flex items-center gap-1.5 rounded-lg bg-teal-700 hover:bg-teal-800 px-4 py-2 text-xs font-bold text-white transition shadow-sm disabled:opacity-50">
                {generatingPDF ? <Icons.Loader2 size={14} className="animate-spin" /> : <Icons.Download size={14} />}
                {TRANSLATIONS[lang].downloadPdf}
              </button>
            </div>
          );
        }
        return null;
      };

      return (
        <div className="h-screen bg-gray-50 flex flex-col overflow-hidden">
          <AppHeader activeTab={screen} onNav={handleNav} right={renderRight()} lang={lang} setLang={setLang} />
          <div className={`flex-1 flex flex-col ${screen === "viewer" ? "overflow-hidden" : "overflow-y-auto"}`}>
            {screen === "upload" && <UploadScreen onRun={handleRun} onNav={handleNav} codeSets={codeSets} lang={lang} setLang={setLang} />}
            {screen === "results" && <ResultsScreen data={reviewData} onOpenViewer={() => setScreen("viewer")} onNav={handleNav} lang={lang} setLang={setLang} />}
            {screen === "viewer" && <ViewerScreen data={reviewData} onBack={() => setScreen("results")} lang={lang} setLang={setLang} />}
            {screen === "history" && <HistoryScreen onNav={handleNav} onLoadReview={handleLoadReview} lang={lang} setLang={setLang} />}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>

</html>
